<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Framework Creative</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/framework-creative/favicon.png" type="image/png">
  <link rel="stylesheet" href="/framework-creative/css/style.css">
  <style>
    .nf{min-height:100dvh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
    .nf__in{position:relative;display:grid;gap:18px;justify-items:center;animation:rise .9s var(--ease) both}
    .nf__code{font-family:var(--font-d);font-weight:700;font-size:clamp(80px,18vw,180px);line-height:1;color:var(--accent);letter-spacing:-.06em}
  </style>
</head>
<body>
  <main class="nf">
    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>
    <div class="wrap nf__in">
      <p class="nf__code" aria-hidden="true">404</p>
      <h1 class="h2">This page isn't here.</h1>
      <p class="lead">The link may be old or mistyped. The portfolio, prices and contact form are all on the home page.</p>
      <!-- Relative link: works on github.io project pages and custom domains -->
      <a class="btn btn--primary" href="/framework-creative/">Go to the home page</a>
    </div>
  </main>
</body>
</html>
